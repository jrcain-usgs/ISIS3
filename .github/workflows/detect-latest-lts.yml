name: Detect Latest LTS version

on:
  push:
    branches:
      - cicd-lts-ver

jobs:

  detect_version:
    name: Detect Version
    runs-on: ubuntu-latest
    outputs:
      maxlts: ${{ steps.parse_lts.outputs.maxlts }}
      maxprod: ${{ steps.parse_prod.outputs.maxprod }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch and Parse LTS Version
        id: parse_lts
        run: |
          MAX_LTS="$( \
          git ls-remote --heads origin | \
          sed '/-lts/!d; s/^.*refs\/heads\///; s/-lts//; /^[0-9][0-9]*$/!d' | \
          sort -n | \
          tail -n 1 \
          )"
          echo "maxlts=${MAX_LTS}-lts" >> $GITHUB_OUTPUT
      - name: Fetch and Parse Prod Version
        id: parse_prod
        run: |
          MAX_PROD="$( \
          git ls-remote --heads origin | \
          sed '/-prod/!d; s/^.*refs\/heads\///; s/-prod//; /^[0-9][0-9]*$/!d' | \
          sort -n | \
          tail -n 1 \
          )"
          echo "maxprod=${MAX_PROD}-prod" >> $GITHUB_OUTPUT
      - name: Show Output
        run: |
          echo "${{ steps.parse_lts.outputs.maxlts }}"
          echo "${{ steps.parse_prod.outputs.maxprod }}"

  access_version:
    needs: detect_version
    name: Access/Use Version
    runs-on: ubuntu-latest
    env:
      MAX_LTS: ${{ needs.detect_version.outputs.maxlts }}
      MAX_PROD: ${{ needs.detect_version.outputs.maxprod }}
    steps:
      - name: Print Max LTS Version detected
        run: echo $MAX_LTS
      - name: Print Max Production Version detected
        run: echo $MAX_PROD
