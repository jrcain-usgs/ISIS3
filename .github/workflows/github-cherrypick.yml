name: GH Cherrypick bugfixes/features for LTS/Prod

env:
  GITHUB_SHA: ${{ github.sha }}
  CURRENT_LTS: lts-test-ch
  # CURRENT_PROD: prod-test

on:
  push:
    branches:
      - dev-test-ch
      
jobs:
  # Check if the PR is a bugfix/feature
  check_labels:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    name: Check PR labels action step
    # Make the output of this job available to other jobs
    outputs: 
      result: ${{steps.execute_py_script.outputs.result}}
    steps:
    - name: Checkout files (only the PR Label Checker)
      uses: actions/checkout@v4
    - name: List files in current Directory
      run: ls .github
    - name: Get PR number
      id: getpr
      uses: bcgov/action-get-pr@v0.1.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Get changed files
      env:
        GITHUB_PR: ${{ steps.getpr.outputs.pr }}
        GH_TOKEN: ${{ github.token }}
      id: files
      run: |
        if \
        gh api repos/${{ github.repository }}/ISIS3/pulls/$GITHUB_PR/files --jq '.[].filename' | \
        grep '^changes\/[0-9]*\.fix\.md'; then
            echo "Fixes Found"
            echo "fixes=true" >> $GITHUB_ENV
        else
            echo "No Fixes Found"
            echo "fixes=false" >> $GITHUB_ENV
    
